# Euclid @ IRSA. See ../README.md for rules and conventions.
# S3 bucket nasa-irsa-euclid-q1 is in us-east-1.

mission:
  id: euclid
  name: Euclid
  aliases: []
  agency: ESA (NASA partner)
  launch: 2023-07-01
  wavelength_um: [0.55, 2.0]
  coverage: ~14,000 sq deg wide + ~50 sq deg deep
  archive_page: https://irsa.ipac.caltech.edu/Missions/euclid.html
  status: active
  as_of: 2026-09-30

collections:
  - id: euclid.ero
    name: Early Release Observations
    aliases: [ERO]
    kind: release
    status: available
    released: 2024-05-23
    cadence: once
    doi: 10.57780/esa-qmocze3   # ESA DOI
    # /data/Euclid/ERO/overview.html also serves the page; the "Overview" icon (ERO/Validation/overview.html) is a 404.
    overview: https://irsa.ipac.caltech.edu/data/Euclid/docs/overview_ero.html
    notes: []
    as_of: 2026-10-06
    datasets:
      - id: euclid.ero.images
        name: ERO images
        type: image
        description: Per-target image folders
        access:
          # The ERO overview page lists only directories + DCE, but SIA euclid_ero is live (checked 2026-10-06).
          - {via: sia, name: euclid_ero}
          - {via: browse, name: "https://irsa.ipac.caltech.edu/data/Euclid/ERO/images/"}
          - {via: gui, name: euclid_ero, note: "IRSA Viewer DCE: https://irsa.ipac.caltech.edu/irsaviewer/dce?api=dl&id=euclid_ero"}
        docs: []

  - id: euclid.q1
    name: Quick Release 1
    aliases: [Q1, QR1, Quick Data Release 1]
    kind: release
    status: available
    released: 2025-03-19
    cadence: once
    doi:                     # none at release level; 28 per-product DOIs (10.26131/IRSA599-627) are listed on the overview page
    overview: https://irsa.ipac.caltech.edu/data/Euclid/docs/overview_q1.html
    notes:
      - "Fields: EDF-N, EDF-F, EDF-S, LDN1641 (LDN1641 has no EXT data)"
      - "On-prem root https://irsa.ipac.caltech.edu/ibe/data/euclid/q1/ (MD5 checksums under checksums/)"
      - "Bulk download scripts are in the S3 bucket under q1/"
    as_of: 2026-10-07
    datasets:
      - id: euclid.q1.mer-mosaic
        name: MER mosaics
        type: image
        description: Background-subtracted multi-wavelength mosaics, organized by TILE ID
        doi: 10.26131/IRSA601
        access:
          - {via: sia, name: euclid_DpdMerBksMosaic}
          - {via: cutout}
          - {via: browse, name: "https://irsa.ipac.caltech.edu/ibe/data/euclid/q1/MER/"}
          - {via: s3, name: "nasa-irsa-euclid-q1/q1/MER/"}
          - {via: gui, name: Euclid Data Explorer}
        files:
          # {instrument_dir}: VIS | NISP | DECAM ... ; {filter}: VIS | NIR-Y | NIR-J | NIR-H ... (verified in S3 listing)
          pattern: "MER/{tile}/{instrument_dir}/EUC_MER_BGSUB-MOSAIC-{filter}_TILE{tile}-*_{timestamp}_*.fits"
        docs: []

      - id: euclid.q1.vis-frames
        name: VIS calibrated quadrant frames
        type: image
        access:
          - {via: sia, name: euclid_DpdVisCalibratedQuadFrame}
          - {via: browse, name: "https://irsa.ipac.caltech.edu/ibe/data/euclid/q1/VIS/"}
          - {via: s3, name: "nasa-irsa-euclid-q1/q1/VIS/"}
        files:
          pattern: "VIS/{obs_id}/*"   # organized by Observation ID
        docs: []

      - id: euclid.q1.nisp-frames
        name: NISP calibrated frames
        type: image
        access:
          - {via: sia, name: euclid_DpdNirCalibratedFrame}
          - {via: browse, name: "https://irsa.ipac.caltech.edu/ibe/data/euclid/q1/NIR/"}
          - {via: s3, name: "nasa-irsa-euclid-q1/q1/NIR/"}
        files:
          pattern: "NIR/{obs_id}/*"   # organized by Observation ID
        docs: []

      - id: euclid.q1.spectra
        name: SIR 1D combined spectra
        type: spectrum
        doi: 10.26131/IRSA616
        access:
          - {via: ssa, name: euclid_DpdSirCombinedSpectra, note: "Load one object's spectrum via /api/spectrumdm/convert/..."}
          - {via: browse, name: "https://irsa.ipac.caltech.edu/ibe/data/euclid/q1/SIR/"}
          - {via: s3, name: "nasa-irsa-euclid-q1/q1/SIR/"}
        files:
          pattern: "SIR/{tile}/*"   # organized by TILE ID
        docs: []

      - id: euclid.q1.mer-catalog
        name: MER final catalog
        type: catalog
        doi: 10.26131/IRSA602
        access:
          - {via: tap, name: euclid_q1_mer_catalogue}
          - {via: scs, name: euclid_q1_mer_catalogue}
          - {via: tap, name: euclid_q1_mer_morphology}
          - {via: tap, name: euclid_q1_mer_cutouts}
          - {via: gui, name: Euclid Data Explorer}
        docs: []

      - id: euclid.q1.phz-catalog
        name: PHZ photometric-redshift catalogs
        type: catalog
        access:
          - {via: tap, name: euclid_q1_phz_photo_z}
          - {via: tap, name: euclid_q1_phz_classification}
          - {via: tap, name: euclid_q1_phz_galaxy_sed}
          - {via: tap, name: euclid_q1_phz_star_sed}
          - {via: tap, name: euclid_q1_phz_star_template}
          - {via: tap, name: euclid_q1_phz_nir_physical_parameters}
          - {via: tap, name: euclid_q1_phz_qso_physical_parameters}
        docs: []

      - id: euclid.q1.spe-catalogs
        name: SPE redshift, line and model catalogs
        type: catalog
        access:
          - {via: tap, name: euclid_q1_spectro_zcatalog_spe_galaxy_candidates}
          - {via: tap, name: euclid_q1_spectro_zcatalog_spe_qso_candidates}
          - {via: tap, name: euclid_q1_spectro_zcatalog_spe_star_candidates}
          - {via: tap, name: euclid_q1_spectro_zcatalog_spe_classification}
          - {via: tap, name: euclid_q1_spectro_zcatalog_spe_quality}
          - {via: tap, name: euclid_q1_spe_lines_line_features}
          - {via: tap, name: euclid_q1_spe_lines_continuum_features}
          - {via: tap, name: euclid_q1_spe_lines_atomic_indices}
          - {via: tap, name: euclid_q1_spe_lines_molecular_indices}
          - {via: tap, name: euclid_q1_spectro_model_catalog_spe_lines_catalog}
          - {via: tap, name: euclid_q1_spectro_model_catalog_spe_star_models}
        docs: []

      - id: euclid.q1.association-tables
        name: Association and CAOM metadata tables
        type: table
        access:
          - {via: tap, name: euclid.tileid_association_q1}
          - {via: tap, name: euclid.objectid_spectrafile_association_q1}
          - {via: tap, name: euclid.observation_euclid_q1}
          - {via: tap, name: euclid.plane_euclid_q1}
          - {via: tap, name: euclid.artifact_euclid_q1}
        docs: []

      - id: euclid.q1.merged-objects
        name: Merged objects (HATS)
        type: catalog
        description: IRSA-contributed; 14 Q1 catalogs joined on object_id, HATS-partitioned Parquet
        access:
          - {via: hats, name: "s3://nasa-irsa-euclid-q1/contributed/q1/merged_objects/hats"}
          - {via: browse, name: "https://irsa.ipac.caltech.edu/data/download/parquet/euclid/q1/merged_objects/hats/"}
        docs: []

  - id: euclid.q2
    name: Quick Release 2
    aliases: [Q2, EGBS, Galactic Bulge Survey]
    kind: release
    status: available
    released: 2026-06-24
    cadence: once
    doi: 10.26131/IRSA661
    overview: https://irsa.ipac.caltech.edu/data/Euclid/docs/overview_q2.html
    notes:
      - "VIS imaging only; no TAP catalogs or S3"
      - "Uses the DR10 data model"
      - "Calibration catalogues are not for statistics"
      # The README says checksum.sha256; the actual file is checksums.sha256
      - "SHA-256 checksums: https://irsa.ipac.caltech.edu/data/Euclid/q2/checksums.sha256"
    as_of: 2026-10-07
    datasets:
      - id: euclid.q2.vis-images
        name: VIS quadrant images
        type: image
        description: "Per-exposure DET (science + flags + RMS; split with splitsci.py), BKG, WGT and CAT files"
        access:
          - {via: sia, name: euclid_q2, note: "Not listed on the Q2 overview page"}
          - {via: browse, name: "https://irsa.ipac.caltech.edu/data/Euclid/q2/data/"}
          - {via: gui, name: euclid_q2, note: "IRSA Viewer DCE: https://irsa.ipac.caltech.edu/irsaviewer/dce?api=dl&id=euclid_q2"}
        files:
          pattern: "EUC_VIS_SWL-{DET|BKG|WGT|CAT}-{obs_id}-{dither}-{expnum}__*.fits"   # CAT also ships as .xml; dither maps to field (see README)
        docs: ["https://irsa.ipac.caltech.edu/data/Euclid/q2/README.md"]

      - id: euclid.q2.psfex-model
        name: PSFEx PSF model
        type: calibration
        access:
          - {via: browse, name: "https://irsa.ipac.caltech.edu/data/Euclid/q2/PSFEx_model/"}
        docs: ["https://irsa.ipac.caltech.edu/data/Euclid/q2/README.md"]

      - id: euclid.q2.calibration-catalogues
        name: Calibration catalogues
        type: catalog
        description: Not for statistical use
        access:
          - {via: browse, name: "https://irsa.ipac.caltech.edu/data/Euclid/q2/calibration_catalogues/"}
        docs: ["https://irsa.ipac.caltech.edu/data/Euclid/q2/README.md"]

  - id: euclid.dr1
    name: Data Release 1
    aliases: [DR1]
    kind: release
    status: planned
    released: 2026-10-21           # TODO: from an ENSCI search snippet only; verify
    cadence: once
    notes: []
    as_of: 2026-09-30

identifiers:
  - {name: TILE ID, example: "102018211", description: "9-digit MER tile; organizes MER products"}
  - {name: Observation ID, example: "2681", description: "Organizes Q1 VIS/NIR frame directories; zero-padded to 6 characters in Q2 filenames (e.g. 067070)"}
  - {name: object_id, description: "Join key across MER, PHZ, SPE catalogs and the HATS merged objects"}
  - {name: SIA obs_id, description: "Tile ID + instrument; tile ID can be derived from it (T05)"}

tools:
  - {name: Euclid Data Explorer, url: "https://irsa.ipac.caltech.edu/applications/euclid", docs: "https://irsa.ipac.caltech.edu/onlinehelp/euclid/euclid/overview.html", use_for: "Search Q1 data by position, Tile ID or Object ID"}
  - {name: Gator (Euclid), url: "https://irsa.ipac.caltech.edu/cgi-bin/Gator/nph-scan?projshort=Euclid", use_for: "Catalog search"}
  - {name: splitsci.py, url: "https://irsa.ipac.caltech.edu/data/Euclid/q2/splitsci.py", use_for: "Split Q2 DET files into SCI/FLG/RMS"}
  - {name: integrity_check.sh, url: "https://irsa.ipac.caltech.edu/data/Euclid/q2/integrity_check.sh", use_for: "Verify Q2 downloads against checksums.sha256"}
  - {name: EuclidExtractor, url: "https://irsa.ipac.caltech.edu/data/Euclid/q2/EuclidExtractor/", use_for: "Compute the Q2 PSFEx PSF model for chosen options (see Euclid_data_extraction.ipynb)"}

known_issues: []   # Data Explorer limitations page is linked under docs; its availability claims are stale

tutorials:
  - {title: "Euclid tutorials (gallery)", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid/", uses: []}
  - {title: "Euclid Q1: MER Mosaics", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-intro-mer-images/", uses: [euclid.q1.mer-mosaic]}
  - {title: "Euclid Q1: MER Catalogs", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-intro-mer-catalog/", uses: [euclid.q1.mer-catalog]}
  - {title: "Euclid Q1: SIR 1D Spectra", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-intro-1d-spectra/", uses: [euclid.q1.spectra]}
  - {title: "Euclid Q1: PHZ Catalogs", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-intro-phz-catalog/", uses: [euclid.q1.phz-catalog, euclid.q1.mer-catalog, euclid.q1.mer-mosaic, euclid.q1.spectra]}
  - {title: "Euclid Q1: SPE Catalogs", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-intro-spe-catalog/", uses: [euclid.q1.spe-catalogs, euclid.q1.mer-catalog]}
  - {title: "Euclid Q1 Merged Objects HATS Catalog: Introduction", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-q1-hats-intro/", uses: [euclid.q1.merged-objects]}
  - {title: "Euclid Q1 Merged Objects HATS Catalog: Magnitudes", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-q1-hats-magnitudes/", uses: [euclid.q1.merged-objects]}
  - {title: "Euclid Q1: Cloud Access", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-cloud-access/", uses: [euclid.q1.mer-mosaic, euclid.q1.spectra]}
  - {title: "Euclid Galaxy Clusters Analysis Tutorial", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-clusters-tutorial/", uses: [euclid.q1.mer-catalog, euclid.q1.phz-catalog]}
  - {title: "Exploring Star Clusters in the Euclid ERO Data", url: "https://caltech-ipac.github.io/irsa-tutorials/euclid-ero/", uses: [euclid.ero.images]}

docs:
  # Q1-only guide; its "coming soon" spectra/TAP statements are stale
  - {title: "Euclid Archive at IRSA User Guide", url: "https://irsa.ipac.caltech.edu/data/Euclid/docs/euclid_archive_at_irsa_user_guide.pdf", kind: user_guide, version: "2025-03-17"}
  - {title: "ESA Q1 Data Product Definitions", url: "https://euclid.esac.esa.int/dr/q1/dpdd/", kind: supplement}
  - {title: "Euclid Q2 paper", url: "https://arxiv.org/abs/2606.25883", kind: paper}
  # Its Known Limitations (spectra/catalogs not in SSA/TAP) are stale
  - {title: "Euclid Data Explorer known issues", url: "https://irsa.ipac.caltech.edu/docs/known_issues/euclidbugslist.html", kind: erratum}
