name: Validate facts against IRSA

# Validate knowledge-map facts against live IRSA services (TAP, SIA, SSA, S3, links).
on:
  pull_request:
    paths:
      - "knowledge-map/**"
      - "scripts/validate_facts.py"
      - ".github/workflows/validate-facts.yml"
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC
  workflow_dispatch:

jobs:
  validate-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests astroquery s3fs
      - run: python scripts/validate_facts.py
