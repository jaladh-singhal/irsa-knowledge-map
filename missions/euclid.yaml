identifiers:
  - id: euclid.identifiers.tile-id
    name: TILE ID
    example: "102018211"
    description: "9-digit MER tile; organizes MER products"
  - id: euclid.identifiers.observation-id
    name: Observation ID
    example: "2681"
    description: "Organizes Q1 VIS/NIR frame directories; zero-padded to 6 characters in Q2 filenames (e.g. 067070)"
  - id: euclid.identifiers.object-id
    name: object_id
    description: "Join key across MER, PHZ, SPE catalogs and the HATS merged objects"
  - id: euclid.identifiers.sia-obs-id
    name: SIA obs_id
    description: "Tile ID + instrument; tile ID can be derived from it (T05)"

